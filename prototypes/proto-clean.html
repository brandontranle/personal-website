<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Clean Slow Field</title>
<style>
  html, body { margin: 0; height: 100%; background: #05040a; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .overlay {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 7vw; color: #ece7f6;
    font-family: Georgia, "Times New Roman", serif;
  }
  .status {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #9a8ec2; margin-bottom: 22px;
  }
  .status .dot { color: #7de0a6; }
  .name { font-size: clamp(48px, 8.5vw, 132px); line-height: 0.94; margin: 0; font-weight: 500; }
  .role { font-size: clamp(28px, 5.2vw, 78px); line-height: 1.0; margin: 0; font-style: italic; color: #c9bfe4; }
  .sub  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: clamp(13px,1.3vw,17px); color: #a99fc4; margin-top: 24px; }
  .hint {
    position: fixed; bottom: 22px; left: 0; right: 0; text-align: center;
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: #5f567e; pointer-events: none;
  }
</style>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="status"><span class="dot">●</span> available · summer 2026</div>
  <h1 class="name">Brandon Le.</h1>
  <h2 class="role">software engineer.</h2>
  <div class="sub">UCLA CS · Co-founder, Vitametrics.</div>
</div>
<div class="hint">clean · slow · one soft light drifting</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.Camera();

const uniforms = {
  uTime: { value: 0 },
  uResolution: { value: new THREE.Vector2() },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
};

const vert = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
`;

const frag = `
  precision highp float;
  varying vec2 vUv;
  uniform float uTime;
  uniform vec2  uResolution;
  uniform vec2  uMouse;

  float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
  float noise(vec2 p){
    vec2 i=floor(p), f=fract(p);
    vec2 u=f*f*(3.0-2.0*f);
    float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
  }
  // low-octave fbm — deliberately smooth, no high-frequency detail
  float fbm(vec2 p){
    float v = 0.0, a = 0.55;
    for(int i=0;i<3;i++){ v += a*noise(p); p *= 2.0; a *= 0.5; }
    return v;
  }

  void main(){
    vec2 uv = vUv;
    float aspect = uResolution.x / max(uResolution.y, 1.0);
    vec2 p = vec2(uv.x*aspect, uv.y);
    float t = uTime * 0.05;                 // very slow

    vec2 m = (uMouse - 0.5) * 0.20;

    // one gentle domain warp at large scale -> big, soft, flowing forms
    vec2 q = vec2(fbm(p*0.9 + vec2(0.0, t)),
                  fbm(p*0.9 + vec2(3.2, 1.7) - t*0.8));
    float f = fbm(p*0.9 + 1.15*q + m);

    // calm dark palette, wide smooth bands (lots of negative space)
    vec3 c0 = vec3(0.020, 0.018, 0.045);    // near-black
    vec3 c1 = vec3(0.090, 0.055, 0.190);    // deep violet
    vec3 c2 = vec3(0.320, 0.190, 0.520);    // violet
    vec3 c3 = vec3(0.720, 0.640, 0.960);    // soft lavender

    vec3 col = mix(c0, c1, smoothstep(0.20, 0.55, f));
    col = mix(col, c2, smoothstep(0.52, 0.82, f));
    col = mix(col, c3, smoothstep(0.84, 1.02, f));

    // a single soft light that drifts slowly across the field
    vec2 lp = vec2(0.62 + 0.22*sin(t*0.6), 0.50 + 0.16*cos(t*0.45));
    float d = length((uv - lp) * vec2(aspect, 1.0));
    float glow = exp(-d*d*2.6);
    col += c3 * glow * 0.30;

    // whisper of grain to avoid banding on the smooth gradients
    float gr = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453 + t);
    col += (gr - 0.5) * 0.012;

    // soft vignette to settle the edges
    vec2 cv = uv - 0.5;
    col *= 1.0 - dot(cv, cv) * 0.45;

    gl_FragColor = vec4(max(col, 0.0), 1.0);
  }
`;

const mat = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, uniforms });
scene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), mat));

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  uniforms.uResolution.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('pointermove', (e) => {
  uniforms.uMouse.value.set(e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight);
});

const start = performance.now();
function loop(){
  uniforms.uTime.value = (performance.now() - start) / 1000;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
