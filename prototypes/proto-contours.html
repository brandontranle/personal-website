<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Flowing Contours</title>
<style>
  html, body { margin: 0; height: 100%; background: #06060a; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .overlay {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 6vw 9vh; color: #ece7f6;
    font-family: Georgia, "Times New Roman", serif;
    transition: color 0.4s ease;
  }
  .status {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    margin-bottom: 20px; opacity: 0.85;
  }
  .name { font-size: clamp(48px, 9vw, 140px); line-height: 0.92; margin: 0; font-weight: 500; }
  .role { font-size: clamp(28px, 5.5vw, 82px); line-height: 1.0; margin: 0; font-style: italic; }
  .sub  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: clamp(13px,1.3vw,17px); margin-top: 22px; opacity: 0.75; }
  .hud {
    position: fixed; top: 22px; left: 6vw; right: 6vw;
    display: flex; justify-content: space-between; align-items: center;
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: #9a8ec2; pointer-events: none;
  }
  .light .overlay { color: #241a14; }
  .light .hud { color: #6a4f3a; }
</style>
<canvas id="c"></canvas>
<div class="hud">
  <span id="modeLabel">mode 1 · dark luminous</span>
  <span>press 1 / 2 to switch treatment · move mouse to drift</span>
</div>
<div class="overlay">
  <div class="status">● available · summer 2026</div>
  <h1 class="name">Brandon Le.</h1>
  <h2 class="role">software engineer.</h2>
  <div class="sub">UCLA CS · Co-founder, Vitametrics.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.Camera();

const uniforms = {
  uTime: { value: 0 },
  uResolution: { value: new THREE.Vector2() },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
  uMode: { value: 0 },
};

const vert = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
`;

const frag = `
  precision highp float;
  varying vec2 vUv;
  uniform float uTime;
  uniform vec2  uResolution;
  uniform vec2  uMouse;
  uniform float uMode;

  float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
  float noise(vec2 p){
    vec2 i=floor(p), f=fract(p);
    vec2 u=f*f*(3.0-2.0*f);
    float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
  }
  float fbm(vec2 p){
    float v=0.0, a=0.5;
    for(int i=0;i<6;i++){ v += a*noise(p); p*=2.02; a*=0.5; }
    return v;
  }

  // domain-warped height field — the descendant of the p5 flow field
  float height(vec2 p, float t){
    vec2 q = vec2(fbm(p + vec2(0.0, t*0.15)), fbm(p + vec2(5.2,1.3) - t*0.12));
    vec2 r = vec2(fbm(p + 2.4*q + vec2(1.7,9.2)), fbm(p + 2.4*q + vec2(8.3,2.8)));
    return fbm(p + 2.6*r);
  }

  void main(){
    vec2 uv = vUv;
    float aspect = uResolution.x / max(uResolution.y, 1.0);
    vec2 p = vec2(uv.x*aspect, uv.y) * 2.2;
    float t = uTime * 0.6;
    p += (uMouse - 0.5) * 0.4;

    float h = height(p, t);

    // iso-contours via fwidth for crisp, resolution-independent lines
    float N = 13.0;
    float hs = h * N;
    float g = fract(hs);
    float dLine = min(g, 1.0 - g);
    float w = fwidth(hs);
    float line = 1.0 - smoothstep(0.0, w*1.5, dLine);

    // major contour every 5th line
    float hsM = h * (N/5.0);
    float gM = fract(hsM);
    float dM = min(gM, 1.0 - gM);
    float wM = fwidth(hsM);
    float major = 1.0 - smoothstep(0.0, wM*1.6, dM);

    // slow diagonal light sweep — the "outshine" moment
    float sweep = 0.5 + 0.5 * sin(dot(uv, vec2(1.5, 0.9)) * 3.0 - t * 1.1);
    sweep = pow(sweep, 2.2);

    // soft wide glow around each line (fake bloom)
    float glow = 1.0 - smoothstep(0.0, w*7.0, dLine);

    vec3 col;

    if (uMode < 0.5) {
      // ---- MODE 1: DARK LUMINOUS ----
      vec3 bg = mix(vec3(0.015,0.015,0.035), vec3(0.06,0.035,0.12), h);
      vec3 lineLow  = vec3(0.34, 0.18, 0.62);
      vec3 lineHigh = vec3(0.86, 0.80, 1.00);
      vec3 lineCol  = mix(lineLow, lineHigh, smoothstep(0.30, 0.92, h));

      col = bg;
      col += lineCol * glow * (0.10 + 0.35 * sweep);
      col += lineCol * line  * (0.55 + 1.30 * sweep);
      col += vec3(1.0, 0.96, 1.0) * major * (0.45 + 0.95 * sweep);
      // faint hot specks where crests meet the sweep
      col += vec3(1.0) * pow(major * sweep, 3.0) * 0.4;
    } else {
      // ---- MODE 2: WARM POSTER (contours on graph paper) ----
      vec3 paper = vec3(0.94, 0.905, 0.83);
      // faint graph-paper grid
      vec2 gp = vec2(uv.x*aspect, uv.y) * 34.0;
      vec2 gpf = abs(fract(gp) - 0.5);
      float grid = (1.0 - smoothstep(0.0, 0.035, min(gpf.x, gpf.y))) * 0.06;
      vec3 bg = paper - grid;

      vec3 violet = vec3(0.42, 0.30, 0.68);
      vec3 peach  = vec3(0.90, 0.48, 0.34);
      vec3 lineCol = mix(violet, peach, smoothstep(0.35, 0.85, h));

      col = bg;
      col = mix(col, lineCol, line * 0.85);
      col = mix(col, lineCol * 0.7, major * 0.9);
    }

    // film grain
    float gr = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453 + t);
    col += (gr - 0.5) * (uMode < 0.5 ? 0.02 : 0.03);

    // gentle vignette
    vec2 cv = uv - 0.5;
    float vig = 1.0 - dot(cv, cv) * (uMode < 0.5 ? 0.55 : 0.35);
    col *= vig;

    gl_FragColor = vec4(max(col, 0.0), 1.0);
  }
`;

const mat = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, uniforms });
mat.extensions.derivatives = true;
scene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), mat));

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  uniforms.uResolution.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('pointermove', (e) => {
  uniforms.uMouse.value.set(e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight);
});

const label = document.getElementById('modeLabel');
window.addEventListener('keydown', (e) => {
  if (e.key === '1') { uniforms.uMode.value = 0; document.body.classList.remove('light'); label.textContent = 'mode 1 · dark luminous'; }
  if (e.key === '2') { uniforms.uMode.value = 1; document.body.classList.add('light');    label.textContent = 'mode 2 · warm poster'; }
});

const start = performance.now();
function loop(){
  uniforms.uTime.value = (performance.now() - start) / 1000;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
