<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Aurora Curtain Shader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #05040a; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .overlay {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 7vw; color: #fff;
  }
  .status { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.72); margin-bottom: 22px; }
  .status .dot { color: #8affb0; }
  .name { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(54px, 9vw, 128px); line-height: 1.02; margin: 0; }
  .role { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: clamp(32px, 5.6vw, 84px); line-height: 1.05; margin: 0; color: rgba(255,255,255,0.9); }
  .sub  { font-family: 'Inter', system-ui, sans-serif; font-size: clamp(14px,1.3vw,18px); color: rgba(255,255,255,0.7); margin-top: 24px; max-width: 560px; }
  .hint { position: fixed; bottom: 22px; left: 0; right: 0; text-align: center; z-index: 10; font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.42); pointer-events: none; }
</style>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="status"><span class="dot">●</span> available · summer 2026</div>
  <h1 class="name">Brandon Le.</h1>
  <h2 class="role">software engineer.</h2>
  <div class="sub">UCLA CS · Co-founder, Vitametrics.</div>
</div>
<div class="hint">aurora curtain · runtime shader · matched to the video frame</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.Camera();

const uniforms = {
  uTime: { value: 0 },
  uResolution: { value: new THREE.Vector2() },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
};

const vert = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position,1.0); }`;

const frag = `
  precision highp float;
  varying vec2 vUv;
  uniform float uTime;
  uniform vec2  uResolution;
  uniform vec2  uMouse;

  float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
  float noise(vec2 p){
    vec2 i=floor(p), f=fract(p);
    vec2 u=f*f*(3.0-2.0*f);
    float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
  }
  float fbm(vec2 p){
    float v=0.0, a=0.5;
    for(int i=0;i<5;i++){ v += a*noise(p); p*=2.03; a*=0.5; }
    return v;
  }

  void main(){
    vec2 uv = vUv;                 // y = 0 bottom, 1 top
    float t = uTime * 0.05;        // slow

    vec2 m = (uMouse - 0.5) * 0.06;

    // --- vertical ray striations: high frequency in x, stretched in y ---
    float xwob = fbm(vec2(uv.y*2.2 + t*0.5, t*0.3)) * 0.05;   // gentle side-to-side sway
    float x = uv.x + xwob + m.x;
    float rays = fbm(vec2(x*11.0, uv.y*1.3 - t*0.8));         // streaky, mostly vertical
    float fine = fbm(vec2(x*26.0, uv.y*0.7 - t*0.5));         // finer striations
    float curtain = 0.45 + 0.75*rays + 0.30*fine;

    // --- large glow envelope: brightest lower-left, sweeping on a curve ---
    // spine value grows toward upper-right; light lives on the lower-left side
    float spine = (uv.x - 0.02)*1.35 + (uv.y - 0.10)*0.55
                + 0.06*sin(uv.y*3.0 + t*1.2);
    float glow = pow(smoothstep(0.92, -0.05, spine), 1.7);

    float intensity = glow * curtain;

    // --- color ramp: navy (top) -> violet -> magenta -> white-hot (bottom) ---
    vec3 base    = vec3(0.020, 0.020, 0.050);
    vec3 navy    = vec3(0.120, 0.070, 0.320);
    vec3 violet  = vec3(0.430, 0.180, 0.880);
    vec3 magenta = vec3(0.720, 0.360, 0.980);
    vec3 hot     = vec3(0.980, 0.930, 1.000);

    float vpos = smoothstep(0.05, 0.95, uv.y);               // 0 bottom, 1 top
    vec3 lit = mix(magenta, violet, smoothstep(0.0, 0.55, vpos));
    lit = mix(lit, navy, smoothstep(0.55, 1.0, vpos));

    vec3 col = base;
    col += lit * intensity * 1.15;

    // white-hot core along the very bottom where the curtain is densest
    float hotMask = pow(intensity, 2.4) * smoothstep(0.42, 0.0, uv.y);
    col += hot * hotMask * 0.9;

    // whisper of grain, gentle vignette
    float gr = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453 + t);
    col += (gr - 0.5) * 0.012;
    vec2 cv = uv - 0.5;
    col *= 1.0 - dot(cv, cv) * 0.30;

    gl_FragColor = vec4(max(col, 0.0), 1.0);
  }
`;

const mat = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, uniforms });
scene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), mat));

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  uniforms.uResolution.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
window.addEventListener('resize', resize);
resize();
window.addEventListener('pointermove', (e) => {
  uniforms.uMouse.value.set(e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight);
});

const start = performance.now();
function loop(){
  uniforms.uTime.value = (performance.now() - start) / 1000;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
