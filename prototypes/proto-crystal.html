<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Raymarched Crystal</title>
<style>
  html, body { margin: 0; height: 100%; background: #08060f; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .overlay {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 6vw; color: #eae6f5;
    font-family: Georgia, "Times New Roman", serif;
  }
  .status {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #9b86c9; margin-bottom: 24px;
  }
  .status .dot { color: #7de0a6; }
  .name { font-size: clamp(48px, 9vw, 132px); line-height: 0.95; margin: 0; font-weight: 500; }
  .role { font-size: clamp(30px, 6vw, 84px); line-height: 1.0; margin: 0; font-style: italic; color: #c9bfe4; }
  .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: clamp(14px, 1.4vw, 18px); color: #a99fc4; margin-top: 28px; }
  .hint {
    position: fixed; bottom: 22px; left: 0; right: 0; text-align: center;
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: #6a5f8a; pointer-events: none;
  }
</style>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="status"><span class="dot">●</span> available · summer 2026</div>
  <h1 class="name">Brandon Le.</h1>
  <h2 class="role">software engineer.</h2>
  <div class="sub">UCLA CS · Co-founder, Vitametrics.</div>
</div>
<div class="hint">move your mouse — the camera parallaxes, the crystal keeps its own deliberate orbit</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.Camera();

const uniforms = {
  uTime: { value: 0 },
  uResolution: { value: new THREE.Vector2() },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
};

const vert = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
`;

const frag = `
  precision highp float;
  varying vec2 vUv;
  uniform float uTime;
  uniform vec2  uResolution;
  uniform vec2  uMouse;

  mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

  float sdRoundBox(vec3 p, vec3 b, float r){
    vec3 q = abs(p) - b;
    return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0) - r;
  }

  // rotating faceted crystal = rounded box intersected with an octahedron
  float map(vec3 p){
    p.xz *= rot(uTime*0.20);
    p.xy *= rot(uTime*0.13 + 0.4);
    float box = sdRoundBox(p, vec3(0.60,0.92,0.60), 0.10);
    float oct = (abs(p.x)+abs(p.y)+abs(p.z) - 1.55) * 0.57;
    return max(box, oct);
  }

  vec3 calcNormal(vec3 p){
    vec2 e = vec2(0.0012, 0.0);
    return normalize(vec3(
      map(p+e.xyy)-map(p-e.xyy),
      map(p+e.yxy)-map(p-e.yxy),
      map(p+e.yyx)-map(p-e.yyx)
    ));
  }

  // procedural environment: deep violet field with a bright diagonal beam
  vec3 env(vec3 dir){
    dir = normalize(dir);
    float up = dir.y*0.5 + 0.5;
    vec3 deep = vec3(0.045, 0.030, 0.115);
    vec3 mid  = vec3(0.170, 0.075, 0.320);
    vec3 col = mix(deep, mid, up);
    float beam = pow(clamp(dot(dir, normalize(vec3(0.62,0.52,-0.30))), 0.0, 1.0), 6.0);
    col += vec3(0.78, 0.62, 1.00) * beam * 0.95;
    float g2 = pow(clamp(dir.y, 0.0, 1.0), 3.0);
    col += vec3(0.30, 0.20, 0.52) * g2 * 0.40;
    return col;
  }

  void main(){
    vec2 uv = vUv*2.0 - 1.0;
    uv.x *= uResolution.x / max(uResolution.y, 1.0);

    vec2 m = uMouse - 0.5;
    vec3 ro = vec3(0.0, 0.0, 3.2);
    ro.xy += m * 0.45;
    vec3 rd = normalize(vec3(uv, -1.7));
    rd.xy += m * 0.10;
    rd = normalize(rd);

    float t = 0.0;
    float hit = 0.0;
    for(int i=0;i<96;i++){
      vec3 p = ro + rd*t;
      float d = map(p);
      if(d < 0.0012){ hit = 1.0; break; }
      if(t > 8.0) break;
      t += d * 0.85;
    }

    vec3 col;
    if(hit > 0.5){
      vec3 p = ro + rd*t;
      vec3 n = calcNormal(p);
      float fres = pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
      vec3 refr = refract(rd, n, 1.0/1.48);
      vec3 refl = reflect(rd, n);
      vec3 tint = vec3(0.72, 0.56, 1.0);
      col = mix(env(refr) * tint, env(refl), clamp(fres, 0.0, 1.0));
      col += vec3(0.82, 0.70, 1.0) * fres * 0.60;
      vec3 L = normalize(vec3(0.6, 0.8, 0.4));
      float spec = pow(max(dot(refl, L), 0.0), 60.0);
      col += vec3(1.0) * spec * 0.85;
      float edge = pow(1.0 - abs(dot(n, -rd)), 2.0);
      col += tint * edge * 0.14;
    } else {
      col = env(rd);
    }

    float g = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453 + uTime);
    col += (g - 0.5) * 0.02;
    vec2 q = vUv - 0.5;
    col *= 1.0 - dot(q, q) * 0.55;
    col = pow(max(col, 0.0), vec3(0.90));
    gl_FragColor = vec4(col, 1.0);
  }
`;

const mat = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, uniforms });
scene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), mat));

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  uniforms.uResolution.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('pointermove', (e) => {
  uniforms.uMouse.value.set(e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight);
});

const start = performance.now();
function loop(){
  uniforms.uTime.value = (performance.now() - start) / 1000;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
